name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
  skill-quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: SkillEvaluator Tier 1 (validate + security-scan)
        run: |
          uv tool install git+https://github.com/NVIDIA/SkillEvaluator.git || exit 0
          for s in plugins/nereus/skills/*/; do
            skillevaluator validate "$s" || true
            skillevaluator security-scan "$s" || true
          done
