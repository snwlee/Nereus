name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 이상: phone 스크립트·테스트가 전역 WebSocket 을 쓴다(Node 20 에는 없다).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  skill-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: SkillEvaluator Tier 1 (키 없이 도는 결정론 검사)
        run: |
          uv tool install git+https://github.com/NVIDIA/SkillEvaluator.git || exit 0
          for s in plugins/nereus/skills/*/; do
            for check in validate quality-check security-scan lint-scripts pii-scan; do
              skillevaluator "$check" "$s" || true
            done
          done
      - name: SkillSpector (스킬 보안 스캔)
        env:
          SKILLSPECTOR_VERSION: v2.13.7
        # 판정 기준 (.github/skillspector/README.md):
        # - 스킬마다 따로 스캔한다. 재귀 스캔은 --baseline 을 받지 않는다.
        # - baselines/<스킬>.yaml 은 검토를 마친 기존 지적과 그 사유다. 내용이 바뀐 줄은 다시 지적된다.
        # - 새 CRITICAL/HIGH 지적, 스캔 실패, skillspector 위험도 HIGH 이상 → 실패.
        #   새 MEDIUM/LOW 는 경고로 띄운다(scan-gate.mjs 와 같은 기준).
        run: |
          uv tool install "git+https://github.com/NVIDIA/skillspector.git@${SKILLSPECTOR_VERSION}"
          skillspector --version
          out="$RUNNER_TEMP/skillspector"
          mkdir -p "$out"
          fail=0
          for s in plugins/nereus/skills/*/; do
            name=$(basename "$s")
            report="$out/$name.json"
            baseline=".github/skillspector/baselines/$name.yaml"
            args=(scan "$s" --no-llm --format json --output "$report")
            [ -f "$baseline" ] && args+=(--baseline "$baseline")
            if ! skillspector "${args[@]}" > /dev/null; then
              echo "::error::$name: skillspector 가 실패했거나 위험도 HIGH 이상을 냈다"
              fail=1
            fi
            if ! verdict=$(node plugins/nereus/skills/skill-audit/scripts/scan-gate.mjs "$report"); then
              echo "::error::$name: 새 CRITICAL/HIGH 지적"
              echo "$verdict" | jq '.blocking'
              fail=1
            fi
            warn=$(echo "$verdict" | jq '[.warnings[] | select(.severity != "info")] | length')
            if [ "$warn" != "0" ]; then
              echo "::warning::$name: 새 MEDIUM/LOW 지적 ${warn}건 — 검토 후 고치거나 baseline 에 사유와 함께 추가"
              echo "$verdict" | jq '[.warnings[] | select(.severity != "info") | {id, severity, pattern, location}]'
            fi
          done
          exit "$fail"
