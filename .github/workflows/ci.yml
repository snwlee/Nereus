name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 이상: phone 스크립트·테스트가 전역 WebSocket 을 쓴다(Node 20 에는 없다).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  skill-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: SkillEvaluator Tier 1 (키 없이 도는 결정론 검사)
        run: |
          uv tool install git+https://github.com/NVIDIA/SkillEvaluator.git || exit 0
          for s in plugins/*/skills/*/; do
            for check in validate quality-check security-scan lint-scripts pii-scan; do
              skillevaluator "$check" "$s" || true
            done
          done
      - name: SkillSpector (스킬 보안 스캔)
        env:
          SKILLSPECTOR_VERSION: v2.13.7
        # 판정 기준 (.github/skillspector/README.md):
        # - plugins/*/skills/*/ 의 모든 스킬을 하나씩 스캔한다(새 플러그인도 글롭으로 자동 포함).
        #   재귀 스캔은 --baseline 을 받지 않는다.
        # - baselines/<플러그인>/<스킬>.yaml 은 검토를 마친 기존 지적과 그 사유다. 내용이 바뀐 줄은 다시 지적된다.
        # - 새 CRITICAL/HIGH 지적, 스캔 실패, skillspector 위험도 HIGH 이상 → 실패.
        #   새 MEDIUM/LOW 는 경고로 띄운다(scan-gate.mjs 와 같은 기준).
        # - 로컬에서도 같은 스크립트를 돌린다: .github/skillspector/scan-all.sh
        run: |
          uv tool install "git+https://github.com/NVIDIA/skillspector.git@${SKILLSPECTOR_VERSION}"
          skillspector --version
          .github/skillspector/scan-all.sh "$RUNNER_TEMP/skillspector"
