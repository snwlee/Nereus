name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
  skill-quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: SkillEvaluator Tier 1 (키 없이 도는 결정론 검사)
        run: |
          uv tool install git+https://github.com/NVIDIA/SkillEvaluator.git || exit 0
          for s in plugins/nereus/skills/*/; do
            for check in validate quality-check security-scan lint-scripts pii-scan; do
              skillevaluator "$check" "$s" || true
            done
          done
      - name: SkillSpector (스킬 보안 스캔)
        run: |
          uv tool install git+https://github.com/NVIDIA/skillspector.git || exit 0
          skillspector scan plugins/nereus/skills --json || true
